[Settings.Debug]
bEnableConsoleWindow = false
bPauseOnStart = false
bDebug = false
bAllowNonMK = false
; Floyd dev logs (hash inputs, seeds, extracted ids), while Floyd Tracking runs
bFloydDebug = false
; Profile dev logs (platform, platform id, save key), while Profile Getter runs
bProfileDebug = false

[Settings.Debug.FloodToggles]
bFName = false
bEndpoint = false
bCurl = false

[Settings]
iLogSize = 100
iLogLevel = 0

[Keybinds]
hkMenu = F1
hkInfo = TAB

[Patches]
; What MK12TTH sets up when the game starts (also in game: Settings, MK12TTH). Everything is on when its key is missing.
; Features with a live switch are turned off and on in game from MODS, LIVE FEATURES (saved to MK12TTH_State.ini)
; Infrastructure: the game's popups and toasts, the MK12TTH tab and MODS menu
bEnableVersionInfo = true
bEnableGameState = true
bEnableGameMessageBox = true
bEnableModSettings = true
; Mods: loading pak mods, their on and off switches (MODS, PAK MODS)
bEnableModLoader = true
bEnablePakMods = true
; Engine.ini values pak mods need (an Engine.ini in the mod's folder in Content\Mods, or one inside its pak), put in memory, never saved
bModEngineConfig = true
; Names: MK12TTH's copy of the game's name-to-text functions, string swaps from string_swaps.txt (live)
bUNameGetter = true
bEnableStringSwap = true
; Announcer: GAME, AUTO (your fighter's announcer) or any announcer, picked in MODS, LIVE FEATURES
bAnnouncerOverride = true
; Floyd: tracking (live), the Floyd Tower alert and Floyd stats (live), secret fight conditions (their console log is live only, MODS)
bEnableFloydTracking = true
; Floyd Tower times: Game reads the game's own schedule, Calculated redoes its math from the profile hash
szFloydTowerMode = Game
bFloydTowerAlert = true
bGetFightMetadata = true
; Online: profile info (live), web capture of the sign in ticket and access token (live, off at first)
bEnableProfileGetter = true
bPatchCurl = true
; Quality of life: attract mode delay (live: Game = 30 seconds, Never, or seconds), keep running without focus (live, off at first),
; skip the waits of the logo and legal screens
bAttractModeSwitch = true
szAttractModeDelay = Game
bKeepRunning = true
bFastBoot = true

