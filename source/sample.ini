[Settings.Debug]
bEnableConsoleWindow = false
bPauseOnStart = false
bDebug = false
bAllowNonMK = false
; Floyd dev logs (hash inputs, seeds, extracted ids), while Floyd Tracking runs
bFloydDebug = false
; Profile dev logs (platform, platform id, save key), while Profile Getter runs
bProfileDebug = false

[Settings.Debug.FloodToggles]
bFName = false
bEndpoint = false
bCurl = false

[Settings]
iLogSize = 50
iLogLevel = 0

[Keybinds]
hkMenu = F1
hkInfo = TAB

[Patches]
; What MK12TTH sets up when the game starts, also in game: Settings, MK12TTH. A missing key takes the value shown here.
; Changes here apply after a restart. Live choices (MODS, LIVE FEATURES) are saved in MK12TTH_State.ini instead.

; Needed by everything else: version info, game state, the game's popups and toasts, the MK12TTH menus
bEnableVersionInfo = true
bEnableGameState = true
bEnableGameMessageBox = true
bEnableModSettings = true

; Mods: loading unsigned paks, Content\Mods with its switches (MODS, PAK MODS), mods' Engine.ini applied in memory only
bEnableModLoader = true
bEnablePakMods = true
bModEngineConfig = true

; Names: MK12TTH's copy of the game's name table, and string swaps from string_swaps.txt
bUNameGetter = true
bEnableStringSwap = true

; Announcer: GAME, AUTO (your fighter's in fights) or any announcer, picked in MODS, LIVE FEATURES
bAnnouncerOverride = true

; Floyd: tracking, the Floyd Tower alert, Floyd's difficulty level, retries and spawning his tower, secret fight conditions
bEnableFloydTracking = true
; Floyd Tower times: Game reads the game's own schedule, Calculated works them out from your profile
szFloydTowerMode = Game
bFloydTowerAlert = true
bFloydFight = true
bGetFightMetadata = true

; Online: your profile info, platform ticket and access token
bEnableProfileGetter = true
; Web capture: logs the game's web requests in the console, for debugging only
bPatchCurl = false

; Quality of life
; Attract mode delay: Game (30 seconds), Never, or a number of seconds
bAttractModeSwitch = true
szAttractModeDelay = Game
; Keep running when the window isn't in focus (off in MODS until you turn it on)
bKeepRunning = true
; Fast boot: Off, Splash (logo and legal screens don't wait) or Full (also skips the studio logos and intro movie)
szFastBoot = Splash

