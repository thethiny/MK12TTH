[Settings.Debug]
bEnableConsoleWindow = true
bPauseOnStart = true
bDebug = true
bAllowNonMK = true
bVerboseFName = false
; Floyd dev logs (hash inputs, seeds, extracted ids). Turns on Floyd Tracking if it's off
bFloydDebug =true
; Profile dev logs (platform, platform id, save key). Turns on Profile Getter if it's off
bProfileDebug =true

[Settings.Debug.FloodToggles]
bFName = false
bEndpoint = true
bCurl = false

[Settings]
iLogSize = 100
iLogLevel = 10
szModLoader = Kernel32.CreateFileW
szCurlSetOpt = libcurl.curl_easy_setopt
szCurlPerform = libcurl.curl_easy_perform
bEnableKeyboardHotkeys = true

[Patches]
bPatchCurl = true
bFPathLoader = true
bUNameGetter = true
bGetFightMetadata = true
bSerializeSecretFights = false
; Requires UNameGetter or FPathLoader
bEnableStringSwap = false
bEnableFloydTracking =true
; Floyd Tower times: Game reads the game's own schedule, Calculated redoes its math from the profile hash
szFloydTowerMode =Game
bEnableProfileGetter = true
bEnableVersionInfo =true

[Patches.AntiCheat]
; Pak Functions
szModLoaderMode = Unsigned
; Internal Functions
bDisableSignatureCheck = true
bDisableChunkSigCheck = true
; Caller Functions
bDisablePakTOCCheck = true
; UCAS Functions
; Caller Functions
bDisableTOCSigCheck = true

